<style>
:root{
  --bg:#F7F5F1; --surface:#FFFFFF; --ink:#1F2A37; --ink-soft:#6B7280;
  --accent:#E8720C; --accent-soft:#FCE4CC;
  --seal:#2B4C7E; --seal-soft:#E3EAF3;
  --profit:#1F7A4D; --profit-soft:#E4F3EA;
  --loss:#B23A2E; --loss-soft:#FAE6E3;
  --warn:#8A6300; --warn-soft:#FBF0D6;
  --border:#E5E1D8; --radius:16px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#shell{max-width:520px;margin:0 auto;min-height:100vh;display:none;flex-direction:column}
button,input,select,textarea{font-family:inherit;font-size:16px;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}

header.top{position:sticky;top:0;z-index:10;background:var(--bg);
  padding:14px 16px 10px;border-bottom:1px solid var(--border)}
header.top h1{margin:0;font-size:17px;letter-spacing:-.01em}
header.top .plate{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;
  background:var(--ink);color:#fff;padding:2px 7px;border-radius:5px;margin-left:6px;vertical-align:1px}
header.top .sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.4}

main{flex:1;padding:14px 16px 96px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:7px}
.eyebrow:first-child{margin-top:2px}
.qm{width:17px;height:17px;border-radius:50%;border:1.3px solid var(--seal);color:var(--seal);
  background:none;font-size:11px;font-weight:800;line-height:1;cursor:pointer;padding:0;flex:none}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:14px;margin-bottom:10px}
.card.tap{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.row+.row{margin-top:7px}
.row .lbl{font-size:14px;color:var(--ink-soft)}
.row .val{font-size:15px;font-weight:600;white-space:nowrap}
.big{font-size:26px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--ink-soft);line-height:1.55}
hr.sep{border:none;border-top:1px dashed var(--border);margin:11px 0}

.declar{position:relative;padding-top:20px;overflow:hidden}
.declar::before{content:"";position:absolute;top:0;left:0;right:0;height:9px;
  background:radial-gradient(circle at 6px 0, transparent 5px, var(--surface) 5px) 0 0/12px 9px repeat-x;
  border-top:1px solid var(--border)}
.stamp{position:absolute;top:16px;right:12px;transform:rotate(-9deg);
  border:2.5px solid var(--seal);color:var(--seal);border-radius:7px;
  padding:4px 9px;font-size:11px;font-weight:800;letter-spacing:.06em;opacity:.85}
.stamp.bad{border-color:var(--loss);color:var(--loss)}
.stamp.warn{border-color:var(--warn);color:var(--warn)}

.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;
  border:1px solid var(--border);background:#fff;margin-right:5px;margin-top:6px}
.chip.ok{background:var(--profit-soft);border-color:#A9C6B1;color:var(--profit)}
.chip.bad{background:var(--loss-soft);border-color:#DFA595;color:var(--loss)}
.chip.warn{background:var(--warn-soft);border-color:#E3C87A;color:var(--warn)}
.chip.seal{background:var(--seal-soft);border-color:#B6C7DC;color:var(--seal)}

.alert{border-left:4px solid var(--loss);background:var(--loss-soft);border-color:#EBCFC9}
.alert.mid{border-left-color:var(--warn);background:var(--warn-soft);border-color:#EEDDAF}
.alert .t{font-weight:700;font-size:14.5px}
.alert .fix{font-size:12.5px;margin-top:5px}

.btn{display:block;width:100%;padding:14px;border-radius:13px;border:none;
  background:var(--ink);color:#fff;font-weight:700;cursor:pointer;margin-top:8px}
.btn.acc{background:var(--accent)}
.btn.seal{background:var(--seal)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border)}
.btn:active{transform:translateY(1px)}

label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:12px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--border);
  border-radius:11px;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 8px}
.seg{display:flex;gap:6px;margin-top:5px}
.seg button{flex:1;padding:11px 4px;border:1.5px solid var(--border);background:#fff;
  border-radius:11px;font-size:13.5px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:10px 4px;border:1.5px solid var(--border);background:#fff;
  border-radius:11px;font-size:13px;font-weight:700;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--seal);color:#fff;border-color:var(--seal)}

.empty{text-align:center;padding:36px 18px;color:var(--ink-soft);font-size:14px;line-height:1.6}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--border);display:flex;max-width:520px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--ink-soft);padding:9px 2px 10px;
  font-size:10.5px;font-weight:700;cursor:pointer}
nav button .ic{display:block;font-size:18px;margin-bottom:1px}
nav button[aria-current="true"]{color:var(--accent)}
.badge{background:var(--loss);color:#fff;border-radius:99px;font-size:9.5px;
  padding:0 5px;margin-left:2px;vertical-align:top}

#modalRoot:empty{display:none}
.backdrop{position:fixed;inset:0;background:rgba(20,22,18,.5);z-index:50;
  display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;position:relative}
.sheet h2{margin:0 0 3px;font-size:19px;padding-right:34px}
.sheet .x{position:absolute;right:14px;top:14px;background:none;border:none;
  font-size:26px;line-height:1;color:var(--ink-soft);cursor:pointer}
.note{font-size:12.5px;color:var(--ink-soft);background:var(--seal-soft);
  border-left:3px solid var(--seal);padding:10px 12px;border-radius:0 8px 8px 0;margin-top:14px;line-height:1.6}
.note b{color:var(--ink)}
.del{color:var(--loss);background:none;border:none;font-weight:700;font-size:13.5px;
  cursor:pointer;padding:10px 0;width:100%;margin-top:4px}

#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:24px}
#login .box{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:24px 20px}
#login h2{margin:0 0 4px;font-size:18px;text-align:center}
#login .err{color:var(--loss);font-size:13px;margin-top:10px;min-height:16px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);
  color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}

/* Chế độ nhúng — khi chạy bên trong Sổ Xe Ben:
   ẩn tiêu đề riêng, đẩy thanh tab lên trên để không đè thanh tab của app mẹ. */
body.embed header.top{display:none}
body.embed nav{position:static;border-top:none;border-bottom:1px solid var(--border);
  overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:0;background:var(--bg)}
body.embed nav::-webkit-scrollbar{display:none}
body.embed nav button{min-width:82px;padding:8px 4px 9px}
body.embed main{padding:12px 14px 28px}
body.embed #toast{bottom:24px}
body.embed .sheet{border-radius:18px}
body.embed .backdrop{align-items:center;padding:12px}
</style>
</head>

    const [s,t,hc,hs,hset] = await Promise.all([ ref('shifts').get(), ref('taxLedger').get(), ref('customers').get(), ref('suppliers').get(), ref('settings').get() ]);

    howoSettings = hset.exists ? (hset.data()||{}) : {};
    if(t.exists){
      const d = t.data();

/* ══════════ DOANH THU — đọc từ sổ ca, gom theo bí danh ══════════ */
/** Thuế suất VAT áp cho 1 công trình thương mại — SAO CHÉP Y NGUYÊN công
    thức siteVatRateFraction() bên SoXeBenHOWO.html (ưu tiên Nhà Cung Cấp
    đã gắn → gõ tay riêng trên công trình → mặc định chung Cài Đặt) để 2
    app tính ra ĐÚNG 1 con số, không lệch nhau. */
function howoVatRateFraction(s){
  const sup = s.supplierId ? howoSuppliers.find(x=>x.id===s.supplierId) : null;
  if(sup && sup.vatRatePercent!==undefined && sup.vatRatePercent!==null && sup.vatRatePercent!=='') return Number(sup.vatRatePercent)/100;
  if(s.vatRatePercent!==undefined && s.vatRatePercent!==null && s.vatRatePercent!=='') return Number(s.vatRatePercent)/100;
  return (Number(howoSettings.vatRatePercent)||0)/100;
}
/** Doanh thu NET (chưa VAT) của 1 công trình thương mại — SAO CHÉP Y
    NGUYÊN công thức commercialNetSell() bên SoXeBenHOWO.html: tổng
    (KL bán × đơn giá bán) của từng chuyến, bóc VAT ra nếu giá bán đã gồm
    VAT (sellIncludesVat), giữ nguyên nếu giá bán đã là giá net. */
function commercialNetSellThue(s){
  const grossSell = (s.commercialTrips||[]).reduce((sum,t)=>sum+(Number(t.sellVolume)||0)*(Number(t.sellUnitPrice)||0),0);
  return s.sellIncludesVat ? grossSell/(1+howoVatRateFraction(s)) : grossSell;
}
/** Số chuyến thương mại hoàn chỉnh — SAO CHÉP Y NGUYÊN nhánh thương mại
    của siteTripCount() bên SoXeBenHOWO.html (chỉ tính chuyến đã nhập ĐỦ
    4 số mua/bán). */
function commercialTripCountThue(s){
  return (s.commercialTrips||[]).filter(t=>
    (Number(t.buyVolume)>0) && (Number(t.buyUnitPrice)>0) &&
    (Number(t.sellVolume)>0) && (Number(t.sellUnitPrice)>0)
  ).length;
}
/** Doanh thu 1 dòng site-log — chở cước dùng công thức cũ (không đổi);
    thương mại giờ tính ĐÚNG doanh thu bán hàng thật, thay vì luôn ra 0
    (trước đây dtSite chỉ đọc field của chở cước, công trình thương mại
    không có field đó nên luôn tính ra 0 — đây chính là lý do tháng nào
    chạy toàn công trình thương mại thì hiện "Chưa có ca chạy nào"). */
const dtSite = s => s.siteType==='commercial'
  ? commercialNetSellThue(s)
  : (Number(s.volumePerTrip)||0)*(Number(s.materialUnitPrice)||0)*(Number(s.trips)||0);

/** Tìm khách theo tên công trình, có xét bí danh. */
function timKhach(ten){
  const c = chuan(ten);
  return S.khach.find(k => chuan(k.ten)===c || (k.biDanh||[]).some(b=>chuan(b)===c)) || null;
}
/** Khoá gom nhóm: nếu tên đã gắn với khách thì gom theo id khách. */
function khoaGom(ten){
  const k = timKhach(ten);
  return k ? 'k:'+k.id : 't:'+chuan(ten);
}
function doanhThuThang(ym){
  const map = {};
  shifts.filter(sh=>(sh.date||'').slice(0,7)===ym).forEach(sh=>{
    (sh.siteLogs||[]).forEach(s=>{
      const dt = dtSite(s); if(dt<=0) return;
      if(s.siteType==='commercial'){
        // Thương mại gom theo ĐÚNG customerId thật (điểm đổ/nhà thầu) —
        // KHÔNG theo s.siteName (chuỗi ghép Điểm Múc-Điểm Đổ) — và để
        // KHOÁ RIÊNG hẳn với chở cước (tiền tố 'c:'/'ct:' khác 'k:'/'t:')
        // dù trùng cùng 1 khách hàng thật, vì thuế suất 2 loại giao dịch
        // khác nhau (8% dịch vụ vs 10% hàng hoá) — gộp chung sẽ không thể
        // áp đúng thuế suất riêng từng loại cho cùng 1 dòng tổng.
        const custName = s.customerId ? ((howoCustomers.find(x=>x.id===s.customerId)||{}).name||'') : '';
        const nhan = custName || (s.siteName||'').trim() || 'Chưa gắn Khách Hàng (thương mại)';
        const key = s.customerId ? 'c:'+s.customerId : 'ct:'+chuan(nhan);
        if(!map[key]){
          const k = timKhach(nhan);
          map[key] = { key, ten: k? k.ten : nhan, khachId: k? k.id : null, loaiMacDinh:'hang',
                       tenGoc:new Set(), doanhThu:0, chuyen:0 };
        }
        map[key].tenGoc.add(nhan);
        map[key].doanhThu += dt;
        map[key].chuyen += commercialTripCountThue(s);
        return;
      }
      const ten = (s.siteName||'').trim() || 'Chưa đặt tên công trình';
      const key = khoaGom(ten);
      if(!map[key]){
        const k = timKhach(ten);
        map[key] = { key, ten: k? k.ten : ten, khachId: k? k.id : null, loaiMacDinh:'cuoc',
                     tenGoc:new Set(), doanhThu:0, chuyen:0 };
      }
      map[key].tenGoc.add(ten);
      map[key].doanhThu += dt;
      map[key].chuyen += Number(s.trips)||0;
    });
  });
  return Object.values(map).map(x=>({...x, tenGoc:[...x.tenGoc]}))
    .sort((a,b)=>b.doanhThu-a.doanhThu);
}
/** Tên công trình xuất hiện trong sổ ca mà chưa gắn với khách nào — CHỈ
    tính công trình CHỞ CƯỚC (tên nhập thẳng, ổn định, hợp lệ để đối chiếu
    theo tên). Công trình THƯƠNG MẠI có s.siteName tự ghép từ "Điểm Múc -
    Điểm Đổ" của từng chuyến (xem syncSiteNameFromTrips() bên
    SoXeBenHOWO.html) — không phải tên khách/nhà cung cấp thật, nên KHÔNG
    được đối chiếu ở đây nữa. Thương mại đối chiếu riêng ở
    thuongMaiChuaGanHoSo() bên dưới, đúng theo customerId/supplierId thật. */
function tenLa(){
  const set = new Set();
  shifts.forEach(sh=>(sh.siteLogs||[]).forEach(s=>{
    if(s.siteType==='commercial') return;
    const t=(s.siteName||'').trim();
    if(t && dtSite(s)>0 && !timKhach(t)) set.add(t);
  }));
  return [...set];
}
/** Tìm nhà cung cấp theo tên (không có bí danh — S.nhaCC chưa hỗ trợ, xem fNcc()). */
function timNCC(ten){
  const c = chuan(ten);
  return S.nhaCC.find(m => chuan(m.ten)===c) || null;
}
/** Đối chiếu hồ sơ thuế cho công trình THƯƠNG MẠI — ĐÚNG theo Khách Hàng
    (customerId, điểm đổ, ai trả tiền) / Nhà Cung Cấp (supplierId, điểm
    múc, mỏ lấy hàng) đã gắn thật bên sổ ca SoXeBenHOWO.html, thống nhất
    với cách tab Kết Quả bên đó đang làm — KHÔNG dùng s.siteName. Trả về
    4 danh sách: khách/nhà cung cấp CÓ gắn ở sổ ca nhưng CHƯA có hồ sơ thuế
    tương ứng ở đây (cần bấm tạo hồ sơ), và công trình thương mại nào
    CHƯA gắn Khách Hàng/Nhà Cung Cấp nào cả bên sổ ca (cần vào đó gắn
    trước — hồ sơ thuế không tự tạo giúp được, phải sửa tại gốc). CHỈ đọc
    dữ liệu để đối chiếu — KHÔNG tính lại bất kỳ số tiền/doanh thu nào. */
function thuongMaiChuaGanHoSo(){
  const khachThieu = new Map(), nccThieu = new Map();
  const khachChuaGan = new Set(), nccChuaGan = new Set();
  shifts.forEach(sh=>(sh.siteLogs||[]).forEach(s=>{
    if(s.siteType!=='commercial') return;
    const nhan = (s.siteName||'').trim() || '(chưa đặt tên)';
    if(s.customerId){
      const kh = howoCustomers.find(x=>x.id===s.customerId);
      if(kh && !timKhach(kh.name)) khachThieu.set(kh.id, kh.name);
    } else {
      khachChuaGan.add(nhan);
    }
    if(s.supplierId){
      const ncc = howoSuppliers.find(x=>x.id===s.supplierId);
      if(ncc && !timNCC(ncc.name)) nccThieu.set(ncc.id, ncc.name);
    } else {
      nccChuaGan.add(nhan);
    }
  }));
  return {
    khachThieu: [...khachThieu.values()],
    nccThieu: [...nccThieu.values()],
    khachChuaGan: [...khachChuaGan],
    nccChuaGan: [...nccChuaGan]
  };
}

const traRa = (ym,key) => S.invOut.find(x=>x.thang===ym && x.key===key) || null;
const daXuat = (ym,key) => { const r=traRa(ym,key); return !!(r&&r.daXuat); };

/* Loại giao dịch của một dòng doanh thu: chở thuê hay bán hàng.
   Xe cơ động, chuyến nào ra chuyến nấy, nên đánh dấu theo từng dòng. */
const LOAI_GD = {
  cuoc:{ ten:'Chạy cước',    mo:'Dịch vụ vận tải hàng hoá',        suat:VAT_RA  },
  hang:{ ten:'Bán hàng hoá', mo:'Đá, cát, sỏi — sản phẩm khai khoáng', suat:VAT_HANG }
};
function loaiDong(ym,x){ const r=traRa(ym,x.key); return (r&&r.loaiGD)||x.loaiMacDinh||'cuoc'; }
function suatDong(ym,x){
  const r=traRa(ym,x.key);
  if(r && Number(r.thueSuat)>0) return Number(r.thueSuat);
  return LOAI_GD[loaiDong(ym,x)].suat;
}
/** Chênh lệch giữa doanh thu hiện tại và số đã chốt lúc xuất hoá đơn. */
function lechChot(ym,x){
  const r = traRa(ym,x.key);
  if(!r || !r.daXuat || r.dtChot===undefined || r.dtChot===null) return 0;
  return Math.round(x.doanhThu - r.dtChot);
}

/* ══════════ LÔ HÀNG THƯƠNG MẠI ══════════
   Mua bằng TẤN ở mỏ, bán bằng M3 cho công trình.
   Toàn bộ lãi nằm ở hệ số quy đổi giữa hai đơn vị đó. */

const nccById = id => S.nhaCC.find(x=>x.id===id) || null;
const loThang = ym => S.loHang.filter(l=>(l.ngay||'').slice(0,7)===ym);

/* Dầu một chuyến: đi có tải, về không tải, cùng cự ly. */
function dauChuyen(cuLy){
  const km = Number(cuLy)||0;
  const co = dec(S.cfg.dmCoTai), kho = dec(S.cfg.dmKhongTai);
  if(!km || !co) return 0;
  return km*co/100 + km*(kho||co*0.6)/100;
}
/* ── MÔ HÌNH CHI PHÍ ──────────────────────────────────────────
   Chia đôi, vì hai loại này hành xử hoàn toàn khác nhau:

   CỐ ĐỊNH theo tháng — không đổi dù chạy 20 hay 60 chuyến:
     tiền thuê xe, lương cơ bản lái xe, bảo hiểm xã hội,
     bảo hiểm xe, phí đường bộ, giám sát hành trình, phù hiệu.

   BIẾN ĐỔI theo chuyến — chạy thêm chuyến thì tốn thêm:
     dầu, phụ cấp chuyến, lốp và bảo dưỡng theo km.

   Chạy càng nhiều chuyến, chi phí cố định chia càng mỏng.
   Đó là toàn bộ ý nghĩa kinh tế của việc tăng ca.            */

function chiCoDinhThang(){
  const thueXe = S.cfg.phuongAnXe==='thue' ? (num(S.cfg.tienThueThang)||0) : 0;
  const luong  = (num(S.cfg.luongCoBan)||0) * (Number(S.cfg.soLaiXe)||1);
  const bhxh   = num(S.cfg.bhxhThang)||0;
  const khac   = num(S.cfg.chiCoDinhKhac)||0;
  return { thueXe, luong, bhxh, khac, tong: thueXe+luong+bhxh+khac };
}
/* Chi phí BIẾN ĐỔI của một chuyến — phần thật sự tăng thêm khi chạy thêm. */
function chiBienDoi(cuLy){
  const lit = dauChuyen(cuLy);
  const dau = lit * (num(S.cfg.giaDau)||0);
  const phuCap = num(S.cfg.khoanChuyen)||0;
  const khac = num(S.cfg.chiKhacChuyen)||0;
  return { lit, dau, phuCap, khac, tong: dau+phuCap+khac };
}
/* Năng lực chạy tối đa theo giờ lái xe, không phải theo sức xe. */
function nangLuc(){
  const ca   = dec(S.cfg.caMoiNgay)||1;
  const gioCa= dec(S.cfg.gioMoiCa)||8;
  const ngay = Number(S.cfg.ngayLamViec)||26;
  const gioCh= dec(S.cfg.gioMotChuyen)||4.5;
  const soLx = Number(S.cfg.soLaiXe)||1;
  const gioNgay = ca*gioCa;                       // giờ làm việc mỗi lái xe mỗi ngày
  const chuyenNgay = gioCh>0 ? (gioNgay*soLx)/gioCh : 0;
  return { ca, gioCa, ngay, gioCh, soLx, gioNgay,
           chuyenNgay, chuyenThang: chuyenNgay*ngay,
           tangCaNgay: Math.max(0, gioNgay-8),
           tangCaThang: Math.max(0, gioNgay-8)*ngay };
}
/* Điểm hoà vốn tính bằng SỐ CHUYẾN MỖI THÁNG, không phải theo chuyến. */
function hoaVon(laiGopChuyen, cuLy){
  const cd = chiCoDinhThang(), bd = chiBienDoi(cuLy);
  const bien = (Number(laiGopChuyen)||0) - bd.tong;   // lãi góp biên mỗi chuyến
  return { cd, bd, bien,
           soChuyen: bien>0 ? cd.tong/bien : Infinity,
           duoc: bien>0 };
}
/* Giữ tên cũ cho phần còn lại của app: chi phí đầy đủ một chuyến,
   có phân bổ cố định theo số chuyến thực tế của mô hình đang chạy. */
function chiPhiChuyen(cuLy){
  const bd = chiBienDoi(cuLy), cd = chiCoDinhThang(), nl = nangLuc();
  const soCh = nl.chuyenThang>0 ? nl.chuyenThang : (Number(S.cfg.chuyenMoiThang)||25);
  const phanBo = cd.tong/soCh;
  return { lit:bd.lit, dau:bd.dau, luong:bd.phuCap, khac:bd.khac,
           thueXe:phanBo, phanBo, bienDoi:bd.tong, soChuyenThang:soCh,
           tong: bd.tong + phanBo };
}
/* Toàn bộ số liệu của một lô hàng. */
function tinhLo(l){
  const muaTan  = dec(l.muaTan);
  const banKhoi = dec(l.banKhoi);
  const muaHang = num(l.muaTienHang) || Math.round(muaTan * num(l.muaDonGia));
  const banHang = num(l.banTienHang) || Math.round(banKhoi * num(l.banDonGia));
  const muaVat  = num(l.muaVat) || Math.round(muaHang*VAT_HANG/100);
  const banVat  = num(l.banVat) || Math.round(banHang*VAT_HANG/100);
  const heSo    = banKhoi>0 ? muaTan/banKhoi : 0;          // tấn trên mỗi m3
  const cp      = chiPhiChuyen(l.cuLy);
  const laiGop  = banHang - muaHang;
  return { muaTan, banKhoi, muaHang, banHang, muaVat, banVat, heSo, cp,
           laiGop, laiRong: laiGop - cp.tong,
           vatNop: banVat - muaVat,
           gocMua: muaHang + muaVat, gocBan: banHang + banVat };
}
/* Số dư tạm ứng còn lại ở một mỏ. */
function duTamUng(nccId){
  const ung = S.tamUng.filter(t=>t.nccId===nccId).reduce((a,t)=>a+num(t.soTien),0);
  const dung = S.loHang.filter(l=>l.nccId===nccId)
    .reduce((a,l)=>{ const k=tinhLo(l); return a + k.gocMua; },0);
  return { ung, dung, du: ung-dung };
}

const ctThang = ym => S.invIn.filter(h=>(h.ngay||'').slice(0,7)===ym);
const bkThang = ym => S.bangKe.filter(h=>(h.ngay||'').slice(0,7)===ym);
const duocKT = h => h.ttoan==='ck' || Number(h.tong) < NGUONG_CK;
const bkHopLe = h => h.ttoan==='ck' || Number(h.thanhTien) < NGUONG_CK;

/* ══════════ BỘ MÁY THUẾ ══════════ */
function tinhThue(ym){
  const ds = doanhThuThang(ym);
  const dtTong = ds.reduce((t,x)=>t+x.doanhThu,0);
  const dtDaXuat = ds.filter(x=>daXuat(ym,x.key)).reduce((t,x)=>t+x.doanhThu,0);
  const dtChua = dtTong - dtDaXuat;
  const suat = Number(S.cfg.thueSuatRa)||VAT_RA;
  // Mỗi dòng một thuế suất riêng — không gộp một mức cho tất cả nữa.
  const vatRa = ds.reduce((t,x)=> t + x.doanhThu*suatDong(ym,x)/100, 0);
  const dtHang = ds.filter(x=>loaiDong(ym,x)==='hang').reduce((t,x)=>t+x.doanhThu,0);
  const dtCuoc = dtTong - dtHang;

  const ct = ctThang(ym);
  const bk = bkThang(ym);
  // Giá vốn hàng bán = tiền hàng trên hoá đơn vật liệu mua vào (chưa VAT).
  const giaVon = ct.filter(h=>h.loai==='vlieu').reduce((t,h)=>t+(Number(h.tienHang)||0),0);
  const chiHD = ct.reduce((t,h)=>t+(Number(h.tong)||0),0);
  const chiBK = bk.filter(bkHopLe).reduce((t,h)=>t+(Number(h.thanhTien)||0),0);
  const vatVao = ct.filter(duocKT).reduce((t,h)=>t+(Number(h.vat)||0),0);
  const vatMat = ct.filter(h=>!duocKT(h)).reduce((t,h)=>t+(Number(h.vat)||0),0);
  const bkMat = bk.filter(h=>!bkHopLe(h)).reduce((t,h)=>t+(Number(h.thanhTien)||0),0);
  const vatNop = Math.max(0, vatRa - vatVao);
  const ganh = dtTong>0 ? vatNop/dtTong*100 : 0;

  return { ds, dtTong, dtDaXuat, dtChua, suat, vatRa, ct, bk, dtHang, dtCuoc, giaVon,
           laiGop: dtHang - giaVon,
           chiHD, chiBK, chiTong:chiHD+chiBK, vatVao, vatMat, bkMat, vatNop, ganh };
}

/* ══════════ NHIÊN LIỆU ══════════ */
function dauThang(ym){
  const sh = shifts.filter(x=>(x.date||'').slice(0,7)===ym);
  let km=0, lit=0;
  sh.forEach(x=>{
    const d = (Number(x.odoEnd)||0)-(Number(x.odoStart)||0);
    if(d>0 && d<2000) km += d;
    lit += Number(x.fuelAdded)||0;
  });
  const tt = km>0 ? lit/km*100 : 0;
  const dm = dec(S.cfg.dmCoTai);
  return { km, lit, thucTe:tt, dinhMuc:dm,
           vuot: dm>0 && tt>dm ? (tt-dm)/dm*100 : 0 };
}

/* ══════════ HẠN THUẾ ══════════ */
// SỬA LỖI MÚI GIỜ: trước đây dùng .toISOString() (luôn quy về UTC) để lấy
// chuỗi ngày — ở múi giờ Việt Nam (UTC+7), nửa đêm giờ địa phương của
// "ngày cuối tháng" khi quy về UTC bị lùi về NGÀY HÔM TRƯỚC (VD 31/07 00:00
// giờ VN = 30/07 17:00 UTC), nên hạn GTGT luôn hiện sớm hơn thật 1 ngày
// (31/07 hiện thành 30/07, trùng ngày với hạn TNDN vốn dĩ đúng là ngày 30
// — 2 hạn khác nhau bị trùng ngày chỉ do lỗi này). Giờ lấy đúng thành phần
// ngày/tháng/năm theo giờ ĐỊA PHƯƠNG, giống hệt cách homNay() đang làm.
const cuoiThang = (y,m) => { const d=new Date(y,m,0); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
function hanThue(){
  const t=homNay(), y=new Date().getFullYear(), out=[];
  // Ngày thành lập DN — quý nào kết thúc TRƯỚC ngày này nghĩa là DN CHƯA
  // TỒN TẠI trong suốt quý đó, không hề có nghĩa vụ khai/nộp cho quý đó.
  // VD thành lập 09/07/2026: Quý 1 (hết 31/03) và Quý 2 (hết 30/06) đều
  // trước ngày thành lập → bỏ hẳn, không hiện hạn cho 2 quý này nữa.
  const ngayLap = S.cfg.ngayDKKD || null;
  for(let q=1;q<=4;q++){
    const quyKetThuc = cuoiThang(y, q*3);
    if(ngayLap && quyKetThuc < ngayLap) continue;
    const m=q*3+1, yy=m>12?y+1:y, mm=m>12?1:m;
    out.push({ten:`Tờ khai thuế GTGT quý ${q}/${y}`, ngay:cuoiThang(yy,mm),
      ghi:'Chậm nhất ngày cuối của tháng đầu quý sau.'});
    out.push({ten:`Tạm nộp thuế TNDN quý ${q}/${y}`,
      ngay:`${yy}-${String(mm).padStart(2,'0')}-30`,
      ghi:'Chậm nhất ngày 30 của tháng đầu quý sau.'});
  }
  // Quyết toán năm trước — chỉ áp dụng nếu DN đã tồn tại ít nhất 1 ngày
  // trong năm đó (không thì năm trước DN chưa hề thành lập, không có gì
  // để quyết toán).
  if(!ngayLap || ngayLap <= `${y-1}-12-31`){
    out.push({ten:`Quyết toán thuế TNDN & Báo cáo tài chính ${y-1}`, ngay:`${y}-03-31`,
      ghi:'Kèm phụ lục giao dịch liên kết vì anh có giao dịch với chính công ty mình.'});
  }
  return out.filter(h=>soNgay(t,h.ngay)>=-20).sort((a,b)=>a.ngay<b.ngay?-1:1);
}

/* ══════════ CẢNH BÁO ══════════ */
function canhBao(){
  const out=[], t=homNay(), ym=thangXem, K=tinhThue(ym);

  K.ds.forEach(x=>{
    const l = lechChot(ym,x);
    if(l!==0) out.push({nang:true, t:`Doanh thu đổi sau khi đã xuất hoá đơn`,
      d:`${esc(x.ten)}: đã xuất ${vnd(traRa(ym,x.key).dtChot)}, sổ ca hiện là ${vnd(x.doanhThu)} — lệch ${l>0?'+':''}${vnd(l)} đ`,
      fix:'Cần làm hoá đơn điều chỉnh. Báo kế toán ngay, đừng để đến quyết toán.', go:'ra'});
  });

  K.ds.forEach(x=>{
    const r=traRa(ym,x.key);
    if(!r || !r.loaiGD) out.push({nang:false, t:'Chưa chọn loại giao dịch',
      d:`${esc(x.ten)} — app đang tạm tính là chạy cước ${VAT_RA}%.`,
      fix:`Nếu là bán đá, cát, sỏi thì phải là ${VAT_HANG}%. Bấm vào dòng đó để chọn.`, go:'ra'});
  });

  if(K.dtChua>0) out.push({nang:true, t:`Chưa xuất hoá đơn ${vnd(K.dtChua)} đ`,
    d:`Doanh thu ${nhanThang(ym)} đã có trong sổ ca nhưng chưa đánh dấu đã xuất.`,
    fix:'Hoá đơn phải lập khi hoàn thành vận chuyển, không chờ khách trả tiền.', go:'ra'});

  const la = tenLa();
  if(la.length) out.push({nang:false, t:`${la.length} công trình chưa có hồ sơ khách`,
    d: la.slice(0,3).map(esc).join(', ') + (la.length>3?'…':''),
    fix:'Gắn vào hồ sơ khách để app gom đúng và biết mã số thuế khi xuất hoá đơn.', go:'hoso'});

  S.invIn.filter(h=>h.ttoan==='tm'&&Number(h.tong)>=NGUONG_CK).forEach(h=>{
    out.push({nang:true, t:`Trả tiền mặt ${vnd(h.tong)} đ — mất khấu trừ`,
      d:`${esc(h.ncc||'Không rõ')} · ${dmy(h.ngay)}`,
      fix:`Từ ${vnd(NGUONG_CK)} đ trở lên phải chuyển khoản từ tài khoản công ty.`, go:'vao'});
  });
  S.bangKe.filter(h=>h.ttoan==='tm'&&Number(h.thanhTien)>=NGUONG_CK).forEach(h=>{
    out.push({nang:true, t:`Bảng kê ${vnd(h.thanhTien)} đ trả tiền mặt`,
      d:`${esc(h.nguoiBan||'Không rõ')} · ${dmy(h.ngay)}`,
      fix:'Bảng kê từ 5 triệu/người/ngày cũng bắt buộc chuyển khoản, nếu không sẽ bị loại chi phí.', go:'vao'});
  });
  S.invIn.filter(h=>!h.mst).forEach(h=>{
    out.push({nang:false, t:'Hoá đơn thiếu mã số thuế người bán',
      d:`${esc(h.ncc||'Không rõ')} · ${dmy(h.ngay)} · ${vnd(h.tong)} đ`,
      fix:'Hoá đơn không đủ thông tin dễ bị loại khi hậu kiểm.', go:'vao'});
  });
  const thay={};
  S.invIn.forEach(h=>{ if(!h.soHD) return;
    const k=(h.ncc||'')+'|'+h.soHD;
    if(thay[k]) out.push({nang:false, t:'Trùng số hoá đơn',
      d:`${esc(h.ncc)} · số ${esc(h.soHD)} xuất hiện 2 lần`,
      fix:'Kiểm tra lại, tránh kê khai hai lần cùng một hoá đơn.', go:'vao'});
    thay[k]=1; });

  S.nhaCC.forEach(m=>{
    const d = duTamUng(m.id);
    if(d.ung>0 && d.du < 20000000) out.push({nang:d.du<=0, t:`Tạm ứng ở ${esc(m.ten)} sắp hết`,
      d:`Đã chuyển ${vnd(d.ung)} · đã dùng ${vnd(d.dung)} · còn ${vnd(d.du)} đ`,
      fix:'Chuyển thêm trước khi lái xe tới mỏ, đừng để tài xế phải rút tiền mặt trả tại chỗ.', go:'lo'});
  });
  loThang(ym).forEach(l=>{
    const k = tinhLo(l);
    const chuan = Number(S.cfg.heSoQuyDoi)||1.5;
    if(k.heSo>0 && Math.abs(k.heSo-chuan)/chuan > 0.2)
      out.push({nang:false, t:'Hệ số quy đổi lệch bất thường',
        d:`Lô ${dmy(l.ngay)}: ${pct(k.muaTan)} tấn / ${pct(k.banKhoi)} m³ = ${(Math.round(k.heSo*100)/100)} tấn/m³, chuẩn là ${chuan}`,
        fix:'Sổ kho mua vào và bán ra sẽ không khớp. Kế toán sẽ hỏi, chuẩn bị sẵn cách giải thích.', go:'lo'});
    if(k.laiRong<0)
      out.push({nang:false, t:'Lô hàng lỗ',
        d:`Lô ${dmy(l.ngay)}: lãi gộp ${vnd(k.laiGop)} nhưng chi phí chuyến ${vnd(k.cp.tong)}`,
        fix:'Cự ly quá xa hoặc khối lượng quá thấp so với chi phí chạy xe.', go:'lo'});
  });
  if(!num(S.cfg.giaDau)) out.push({nang:false, t:'Chưa nhập giá dầu',
    d:'Không có giá dầu thì app không tính được lãi ròng của chuyến.',
    fix:'Vào Hồ sơ → Chi phí chuyến để nhập.', go:'hoso'});

  const D = dauThang(ym);
  if(D.dinhMuc>0 && D.vuot>15) out.push({nang:false, t:`Dầu vượt định mức ${pct(D.vuot)}%`,
    d:`${nhanThang(ym)}: ${pct(D.thucTe)} lít/100km, định mức ${pct(D.dinhMuc)}`,
    fix:'Cần biên bản giải trình lưu cùng hồ sơ ca, nếu không phần vượt có thể bị loại chi phí.', go:'hoso'});
  if(!D.dinhMuc) out.push({nang:false, t:'Chưa khai định mức nhiên liệu',
    d:'Không có định mức thì chi phí dầu không có gì bảo vệ.',
    fix:'Vào Hồ sơ → Định mức nhiên liệu để nhập, rồi in quyết định ký.', go:'hoso'});

  [['hanBaoHiem','Bảo hiểm'],['hanPhuHieu','Phù hiệu xe tải'],['hanDangKiem','Đăng kiểm']]
  .forEach(([k,ten])=>{
    const v=S.cfg[k];
    if(!v){ out.push({nang:false, t:`Chưa nhập hạn ${ten.toLowerCase()}`,
      d:'App không nhắc được nếu chưa có ngày.', fix:'Vào Hồ sơ nhập ngày hết hạn.', go:'hoso'}); return; }
    const con=soNgay(t,v);
    if(con<0) out.push({nang:true, t:`${ten} đã hết hạn`, d:`Hết hạn ${dmy(v)}, quá ${-con} ngày`,
      fix:'Xe chạy trong tình trạng này có thể bị phạt và thu phù hiệu.', go:'hoso'});
    else if(con<=30) out.push({nang:false, t:`${ten} sắp hết hạn`, d:`Còn ${con} ngày — ${dmy(v)}`,
      fix:'Làm sớm, đừng để sát ngày.', go:'hoso'});
  });

  hanThue().forEach(h=>{ const c=soNgay(t,h.ngay);
    if(c>=0&&c<=12) out.push({nang:c<=4, t:h.ten, d:`Hạn ${dmy(h.ngay)} — còn ${c} ngày`,
      fix:h.ghi, go:'bangiao'}); });

  if(S.cfg.phuongAnXe==='chua') out.push({nang:false, t:'Xe chưa gắn vào công ty',
    d:'Xe đứng tên cá nhân, công ty chưa có căn cứ ghi chi phí cho con xe.',
    fix:'Vào Hồ sơ → Phương án xe để chọn bán hoặc cho thuê.', go:'hoso'});
  if(!S.cfg.khoanChuyen) out.push({nang:false, t:'Chưa có quy chế khoán chi',
    d:'Cơm dọc đường, tiền bãi, tiền lặt vặt đang là tiền mất trắng.',
    fix:'Vào Hồ sơ → Quy chế khoán chi, nhập mức rồi in quyết định ký.', go:'hoso'});

  return out.sort((a,b)=> a.nang===b.nang ? 0 : (a.nang?-1:1));
}

/* ══════════ ĐIỀU HƯỚNG ══════════ */
function go(t){ tab=t; ve(); window.scrollTo(0,0); }
function veHeader(){
  $('#hPlate').textContent = S.cfg.bienSo||'—';
  $('#hCo').textContent = S.cfg.tenCty + ' · MST ' + S.cfg.mst;
}
function ve(){
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current', b.dataset.t===tab));
  const cb=canhBao(), bd=$('#nBadge');
  if(cb.length){bd.hidden=false;bd.textContent=cb.length} else bd.hidden=true;
  $('#view').innerHTML = ({thang:vThang,ra:vRa,lo:vLo,vao:vVao,bangiao:vBanGiao,hoso:vHoSo})[tab](cb);
}
function chonThang(){
  const ds=[...new Set(shifts.map(s=>(s.date||'').slice(0,7)).filter(Boolean))].sort().reverse();
  if(!ds.includes(thangNay())) ds.unshift(thangNay());
  if(!ds.includes(thangXem)) ds.unshift(thangXem);
  return `<select onchange="thangXem=this.value;ve()" style="margin-bottom:12px">
    ${ds.map(m=>`<option value="${m}" ${m===thangXem?'selected':''}>${nhanThang(m)}</option>`).join('')}</select>`;
}

/* ══════════ 1. THÁNG NÀY ══════════ */

    <hr class="sep">
    <div class="row"><span class="lbl" style="font-weight:700;color:var(--ink)">Lãi gộp</span>
      <span class="val" style="font-size:19px;color:${K.laiGop>=0?'var(--profit)':'var(--loss)'}">${vnd(K.laiGop)}</span></div>
    ${K.giaVon===0?`<div class="chip warn">Chưa nhập hoá đơn mua hàng — lãi đang ảo</div>`:''}
    <div class="sub" style="margin-top:8px">Chưa trừ dầu, lương lái và chi phí chạy xe.</div>
  </div>`:''}

  <div class="eyebrow">Thuế giá trị gia tăng ${qm('vat')}</div>
  <div class="card">
    <div class="row"><span class="lbl">Đầu ra ${K.suat}%</span><span class="val">${vnd(K.vatRa)}</span></div>
    <div class="row"><span class="lbl">Đầu vào được khấu trừ</span><span class="val" style="color:var(--profit)">− ${vnd(K.vatVao)}</span></div>
    <hr class="sep">
    <div class="row"><span class="lbl" style="font-weight:700;color:var(--ink)">Phải nộp</span>
      <span class="val" style="font-size:20px">${vnd(K.vatNop)}</span></div>
    ${K.dtTong>0?`<div class="sub" style="margin-top:8px">Tức <b>${pct(K.ganh)}%</b> doanh thu. Đây mới là giá thật của việc xuất hoá đơn, không phải ${K.suat}%.</div>`:''}
    ${K.vatMat>0?`<div class="chip bad">Mất khấu trừ ${vnd(K.vatMat)} đ do tiền mặt</div>`:''}
    <button class="btn ghost" onclick="mDamPhan()">Nên cộng thêm bao nhiêu % để xuất hoá đơn?</button>
  </div>

  <div class="eyebrow">Chi phí có chứng từ</div>
  <div class="card">
    <div class="row"><span class="lbl">${K.ct.length} hoá đơn</span><span class="val">${vnd(K.chiHD)}</span></div>
    <div class="row"><span class="lbl">${K.bk.length} dòng bảng kê hợp lệ</span><span class="val">${vnd(K.chiBK)}</span></div>
    ${K.bkMat>0?`<div class="chip bad">Bảng kê bị loại ${vnd(K.bkMat)} đ do tiền mặt</div>`:''}
    <div class="sub" style="margin-top:8px">Chưa gồm khấu hao xe, lương lái và khoán chi — kế toán ghép thêm từ hồ sơ anh gửi.</div>
  </div>

  <div class="eyebrow">Nhiên liệu ${qm('dinhmuc')}</div>
  <div class="card">
    <div class="row"><span class="lbl">Quãng đường</span><span class="val">${vnd(D.km)} km</span></div>
    <div class="row"><span class="lbl">Dầu đã đổ</span><span class="val">${pct(D.lit)} lít</span></div>
    <div class="row"><span class="lbl">Thực tế</span><span class="val">${D.km>0?pct(D.thucTe)+' lít/100km':'—'}</span></div>
    <div class="row"><span class="lbl">Định mức đã khai</span>
      <span class="val">${D.dinhMuc>0?pct(D.dinhMuc)+' lít/100km':'<span class="chip warn">chưa khai</span>'}</span></div>
    ${D.vuot>0?`<div class="chip ${D.vuot>15?'bad':'warn'}">Vượt ${pct(D.vuot)}%</div>`:''}
  </div>

  <div class="eyebrow">${cb.length?cb.length+' việc cần xử lý':'Không có cảnh báo'}</div>
  ${cb.length ? cb.map(x=>`<div class="card alert ${x.nang?'':'mid'} tap" onclick="go('${x.go}')">
      <div class="t">${x.t}</div><div class="sub" style="margin-top:3px">${x.d}</div>
      <div class="fix">${x.fix}</div></div>`).join('')
   : `<div class="card"><div class="sub">Hồ sơ đang sạch. Giữ nếp: ghi ca mỗi ngày, nhập hoá đơn ngay khi lái xe gửi ảnh.</div></div>`}`;
}

function mDamPhan(){
  const K=tinhThue(thangXem), g=K.ganh||4, loi=K.suat+TNDN;
  moModal(`<h2>Cộng thêm bao nhiêu là hoà?</h2>
    <div class="sub" style="margin-top:4px">Tính trên số thật ${nhanThang(thangXem)}.</div>
    <div class="card" style="margin-top:14px">
      <div class="row"><span class="lbl">Doanh thu</span><span class="val">${vnd(K.dtTong)}</span></div>
      <div class="row"><span class="lbl">VAT đầu ra ${K.suat}%</span><span class="val">${vnd(K.vatRa)}</span></div>
      <div class="row"><span class="lbl">VAT đầu vào khấu trừ</span><span class="val" style="color:var(--profit)">− ${vnd(K.vatVao)}</span></div>
      <hr class="sep">
      <div class="row"><span class="lbl" style="color:var(--ink);font-weight:700">Anh thật sự mất</span>
        <span class="val" style="color:var(--loss)">${vnd(K.vatNop)} = ${pct(g)}%</span></div>
    </div>
    <div class="note">Dầu, lốp, sửa chữa đều có VAT đầu vào. Không xuất hoá đơn ra thì toàn bộ VAT
      đầu vào đó cũng mất theo. Khoảng cách giữa có và không xuất hoá đơn <b>không phải ${K.suat}%</b>,
      chỉ khoảng <b>${pct(g)}%</b>.</div>
    <div class="eyebrow">Câu để nói với công trình</div>
    <div class="card"><div class="sub" style="font-style:italic">
      "Anh trả thêm ${pct(Math.ceil(g))}% để lấy hoá đơn. Nhưng anh được khấu trừ ${K.suat}% VAT,
      lại được tính vào chi phí giảm ${TNDN}–20% thuế thu nhập doanh nghiệp. Tổng lại anh lợi
      khoảng ${loi}%. Trả thêm ${pct(Math.ceil(g))} để lấy về ${loi}."</div>
      <div class="sub" style="margin-top:10px">Ai nghe con số đó mà vẫn từ chối thì thường bên họ
      cũng không có nguồn gốc hàng hoá — cân nhắc cả rủi ro công nợ, không riêng rủi ro thuế.</div>
    </div>
    <button class="btn ghost" onclick="dongModal()">Đóng</button>`);
}

/* ══════════ 2. HOÁ ĐƠN RA ══════════ */
function vRa(){
  const K=tinhThue(thangXem);
  if(!K.ds.length) return chonThang()+`<div class="empty"><b>Chưa có ca chạy nào ${nhanThang(thangXem)}</b>
    Ghi ca trong Sổ Xe Ben, doanh thu tự hiện ở đây.</div>`;
  return chonThang()+`<div class="sub" style="margin-bottom:10px">
    Mỗi dòng là một công trình trong tháng. Bấm để ghi số hoá đơn đã xuất. ${qm('hoadon')}</div>` +
  K.ds.map(x=>{
    const r=traRa(thangXem,x.key), ok=r&&r.daXuat, l=lechChot(thangXem,x);
    const kh = x.khachId ? S.khach.find(k=>k.id===x.khachId) : null;
    const lg = loaiDong(thangXem,x), ts = suatDong(thangXem,x);
    return `<div class="card ${l!==0?'alert':''} tap" onclick="fRa('${js(x.key)}')">
      <div class="row"><b style="font-size:15px">${esc(x.ten)}</b><span class="val">${vnd(x.doanhThu)}</span></div>
      <div class="sub">${x.chuyen} chuyến · VAT ${ts}% = ${vnd(x.doanhThu*ts/100)} đ</div>
      <div>
        <span class="chip ${lg==='hang'?'seal':''}">${LOAI_GD[lg].ten} ${ts}%</span>
        <span class="chip ${ok?'ok':'bad'}">${ok?'Đã xuất':'Chưa xuất'}</span>
        ${r&&r.soHD?`<span class="chip seal">Số ${esc(r.soHD)}</span>`:''}
        ${kh?`<span class="chip ${kh.mst?'ok':'warn'}">${kh.mst?'MST '+esc(kh.mst):'khách chưa có MST'}</span>`
            :'<span class="chip warn">chưa có hồ sơ khách</span>'}
        ${l!==0?`<span class="chip bad">Lệch ${l>0?'+':''}${vnd(l)}</span>`:''}
      </div></div>`;
  }).join('');
}
function fRa(key){
  const K=tinhThue(thangXem), x=K.ds.find(d=>d.key===key); if(!x) return;
  const r = traRa(thangXem,key) || {daXuat:false,soHD:'',ngayXuat:'',loaiGD:'cuoc',thueSuat:0};
  const lgHienTai = loaiDong(thangXem,x), tsHienTai = suatDong(thangXem,x);
  const kh = x.khachId ? S.khach.find(k=>k.id===x.khachId) : null;
  const l = lechChot(thangXem,x);
  moModal(`<h2>${esc(x.ten)}</h2>
    <div class="sub">${nhanThang(thangXem)} · ${x.chuyen} chuyến · doanh thu ${vnd(x.doanhThu)} đ</div>
    ${x.tenGoc.length>1?`<div class="sub" style="margin-top:4px">Gom từ: ${x.tenGoc.map(esc).join(' · ')}</div>`:''}
    ${l!==0?`<div class="card alert" style="margin-top:12px"><div class="t">Doanh thu đã đổi sau khi xuất hoá đơn</div>
      <div class="sub" style="margin-top:4px">Chốt lúc xuất: ${vnd(r.dtChot)} đ<br>Sổ ca hiện tại: ${vnd(x.doanhThu)} đ<br>
      Lệch: <b>${l>0?'+':''}${vnd(l)} đ</b></div>
      <div class="fix">Cần lập hoá đơn điều chỉnh ${l>0?'tăng':'giảm'}. Gửi kế toán kèm biên bản điều chỉnh có chữ ký hai bên.</div>
      <button class="btn ghost" style="margin-top:10px" onclick="chotLai('${js(key)}')">Đã xử lý xong — chốt lại theo số hiện tại</button></div>`:''}
    ${kh?`<div class="card" style="margin-top:12px"><div class="row"><span class="lbl">Khách</span><span class="val">${esc(kh.ten)}</span></div>
      <div class="row"><span class="lbl">MST</span><span class="val">${kh.mst?esc(kh.mst):'—'}</span></div></div>`
      :`<div class="card mid alert" style="margin-top:12px"><div class="t">Chưa có hồ sơ khách</div>
        <div class="fix">Không có mã số thuế thì không xuất được hoá đơn đúng.</div>
        <button class="btn ghost" style="margin-top:8px" onclick="dongModal();go('hoso');setTimeout(()=>fKhach(null,'${js(x.tenGoc[0])}'),80)">Tạo hồ sơ khách ngay</button></div>`}
    <label>Chuyến này là gì?</label>
    <div class="seg" id="rLoai">
      ${Object.entries(LOAI_GD).map(([k,v])=>`<button type="button" data-v="${k}"
        aria-pressed="${lgHienTai===k}" onclick="segPick(this);doiLoai()">${v.ten}<br>
        <span style="font-weight:400;font-size:11px;opacity:.8">VAT ${v.suat}%</span></button>`).join('')}
    </div>
    <div id="rMoTa" class="sub" style="margin-top:7px"></div>
    <label for="rTs">Thuế suất ghi trên hoá đơn (%)</label>
    <input id="rTs" inputmode="numeric" value="${tsHienTai}">
    <div class="card" style="margin-top:10px;background:var(--seal-soft);border-color:#B6C7DC">
      <div class="row"><span class="lbl">Tiền hàng chưa VAT</span><span class="val">${vnd(x.doanhThu)}</span></div>
      <div class="row"><span class="lbl">Tiền thuế</span><span class="val" id="rVat">—</span></div>
      <div class="row"><span class="lbl" style="font-weight:700;color:var(--ink)">Tổng thanh toán</span>
        <span class="val" id="rTong">—</span></div>
    </div>
    <label>Đã xuất hoá đơn chưa?</label>
    <div class="seg" id="rSeg">
      <button type="button" data-v="1" aria-pressed="${r.daXuat}" onclick="segPick(this)">Đã xuất</button>
      <button type="button" data-v="0" aria-pressed="${!r.daXuat}" onclick="segPick(this)">Chưa xuất</button>
    </div>
    <div class="g2">
      <div><label for="rSo">Số hoá đơn</label><input id="rSo" value="${esc(r.soHD)}"></div>
      <div><label for="rNgay">Ngày xuất</label><input type="date" id="rNgay" value="${r.ngayXuat||''}"></div>
    </div>
    <div class="note">Khi bấm "Đã xuất", app <b>chốt</b> con số ${vnd(x.doanhThu)} đ. Sau này sổ ca đổi
      thì app báo lệch ngay. ${qm('chotso')}</div>
    <button class="btn acc" onclick="luuRa('${js(key)}')">Lưu</button>
    <button class="btn ghost" onclick="dongModal()">Đóng</button>`);
  window.__dtDong = x.doanhThu;
  $('#rTs').addEventListener('input', tinhLaiRa);
  doiLoai(true);
}
/* Bấm nút loại giao dịch thì tự điền lại thuế suất chuẩn của loại đó. */
function doiLoai(giuNguyen){
  const k = $('#rLoai button[aria-pressed="true"]').dataset.v;
  if(!giuNguyen) $('#rTs').value = LOAI_GD[k].suat;
  $('#rMoTa').innerHTML = LOAI_GD[k].mo +
    (k==='hang' ? ' — <b>không</b> thuộc diện giảm 2%, phải xuất đúng '+VAT_HANG+'%.'
                : ' — đang được giảm còn '+VAT_RA+'% đến hết 31/12/2026.');
  tinhLaiRa();
}
function tinhLaiRa(){
  const dt = window.__dtDong||0, ts = Number($('#rTs').value)||0;
  const vat = dt*ts/100;
  $('#rVat').textContent = vnd(vat) + ' đ';
  $('#rTong').textContent = vnd(dt+vat) + ' đ';
}
async function luuRa(key){
  const K=tinhThue(thangXem), x=K.ds.find(d=>d.key===key); if(!x) return;
  const daX = $('#rSeg button[aria-pressed="true"]').dataset.v==='1';
  const cu = traRa(thangXem,key);
  const o = { thang:thangXem, key, ten:x.ten, khachId:x.khachId||null, daXuat:daX,
    loaiGD: $('#rLoai button[aria-pressed="true"]').dataset.v,
    thueSuat: Number($('#rTs').value)||0,
    soHD:$('#rSo').value.trim(), ngayXuat:$('#rNgay').value,
    dtChot: daX ? (cu && cu.daXuat && cu.dtChot!==undefined ? cu.dtChot : Math.round(x.doanhThu)) : null };
  const i = S.invOut.findIndex(v=>v.thang===thangXem && v.key===key);
  if(i>=0) S.invOut[i]=o; else S.invOut.push(o);
  await luu(); dongModal(); ve(); toast('Đã lưu');
}
async function chotLai(key){
  const K=tinhThue(thangXem), x=K.ds.find(d=>d.key===key);
  const i = S.invOut.findIndex(v=>v.thang===thangXem && v.key===key);
  if(i>=0 && x){ S.invOut[i].dtChot = Math.round(x.doanhThu); await luu(); dongModal(); ve(); toast('Đã chốt lại'); }
}

/* ══════════ MÀN HÌNH LÔ HÀNG ══════════ */
function vLo(){
  const ds = loThang(thangXem).sort((a,b)=>a.ngay<b.ngay?1:-1);
  const cp = chiPhiChuyen(ds.length?ds[0].cuLy:0);

  const mo = S.nhaCC.map(m=>{
    const d = duTamUng(m.id);
    const het = d.du<=0, sap = d.du<20000000;
    return `<div class="card ${het?'alert':(sap&&d.ung>0?'alert mid':'')} tap" onclick="fNcc('${m.id}')">
      <div class="row"><b style="font-size:15px">${esc(m.ten)}</b>
        <span class="val" style="color:${het?'var(--loss)':'var(--profit)'}">${vnd(d.du)}</span></div>
      <div class="sub">Đã chuyển ${vnd(d.ung)} · đã dùng ${vnd(d.dung)}</div>
      <div><span class="chip ${het?'bad':sap?'warn':'ok'}">${het?'Hết tạm ứng':sap?'Sắp hết':'Còn dư'}</span>
        ${m.mst?`<span class="chip seal">MST ${esc(m.mst)}</span>`:'<span class="chip warn">chưa có MST</span>'}</div>
    </div>`;}).join('');

  const tong = ds.reduce((a,l)=>{ const k=tinhLo(l);
    return { ban:a.ban+k.banHang, mua:a.mua+k.muaHang, gop:a.gop+k.laiGop,
             rong:a.rong+k.laiRong, tan:a.tan+k.muaTan, khoi:a.khoi+k.banKhoi }; },
    {ban:0,mua:0,gop:0,rong:0,tan:0,khoi:0});

  return chonThang() + `
  <div class="eyebrow">Tạm ứng ở mỏ ${qm('tamung')}</div>
  ${mo || `<div class="card"><div class="sub">Chưa có nhà cung cấp nào.</div></div>`}
  <button class="btn ghost" onclick="fNcc()">+ Thêm mỏ / nhà cung cấp</button>
  <button class="btn seal" onclick="fTamUng()">+ Ghi lần chuyển tạm ứng</button>

  ${ds.length?`<div class="eyebrow">Tổng kết ${nhanThang(thangXem)}</div>
  <div class="card declar">
    <span class="stamp ${tong.rong>=0?'':'bad'}">${tong.rong>=0?'CÓ LÃI':'ĐANG LỖ'}</span>
    <div class="sub">${ds.length} lô hàng</div>
    <div class="big">${vnd(tong.rong)} đ</div>
    <div class="sub" style="margin-top:3px">lãi ròng ước tính sau chi phí chạy xe</div>
    <hr class="sep">
    <div class="row"><span class="lbl">Doanh thu bán (chưa VAT)</span><span class="val">${vnd(tong.ban)}</span></div>
    <div class="row"><span class="lbl">Giá vốn mua (chưa VAT)</span><span class="val">− ${vnd(tong.mua)}</span></div>
    <div class="row"><span class="lbl">Lãi gộp</span><span class="val" style="color:var(--profit)">${vnd(tong.gop)}</span></div>
    <hr class="sep">
    <div class="row"><span class="lbl">Mua vào</span><span class="val">${pct(tong.tan)} tấn</span></div>
    <div class="row"><span class="lbl">Bán ra</span><span class="val">${pct(tong.khoi)} m³</span></div>
    <div class="row"><span class="lbl">Hệ số quy đổi thực tế</span>
      <span class="val">${tong.khoi>0?(Math.round(tong.tan/tong.khoi*100)/100)+' tấn/m³':'—'}</span></div>
  </div>`:''}

  ${moHinhHTML(ds)}

  <div class="eyebrow">Danh sách lô hàng</div>
  <button class="btn acc" onclick="fLo()">+ Ghi lô hàng mới</button>
  ${ds.length ? ds.map(l=>{
    const k = tinhLo(l), m = nccById(l.nccId), kh = S.khach.find(x=>x.id===l.khachId);
    return `<div class="card ${k.laiRong<0?'alert':''} tap" onclick="fLo('${l.id}')">
      <div class="row"><b style="font-size:15px">${esc(l.matHang||'Lô hàng')}</b>
        <span class="val" style="color:${k.laiRong>=0?'var(--profit)':'var(--loss)'}">${vnd(k.laiRong)}</span></div>
      <div class="sub">${dmy(l.ngay)} · ${m?esc(m.ten):'chưa chọn mỏ'} → ${kh?esc(kh.ten):'chưa chọn khách'}</div>
      <div class="sub">Mua ${pct(k.muaTan)} tấn ${vnd(k.muaHang)} · Bán ${pct(k.banKhoi)} m³ ${vnd(k.banHang)}</div>
      <div><span class="chip">${(Math.round(k.heSo*100)/100)} tấn/m³</span>
        <span class="chip ok">Lãi gộp ${vnd(k.laiGop)}</span>
        <span class="chip ${k.laiRong>=0?'ok':'bad'}">${k.laiRong>=0?'Lãi ròng':'Lỗ'} ${vnd(Math.abs(k.laiRong))}</span></div>
    </div>`;}).join('')
  : `<div class="card"><div class="sub">Chưa có lô hàng nào ${nhanThang(thangXem)}.</div></div>`}`;
}

/* Khối "Mô hình chi phí" — trái tim của bài toán tăng ca. */
function moHinhHTML(ds){
  const cd = chiCoDinhThang(), nl = nangLuc();
  const cuLy = ds.length ? ds[0].cuLy : (S.cfg.cuLyMacDinh||0);
  const bd = chiBienDoi(cuLy);

  // Lãi gộp trung bình mỗi chuyến, lấy từ lô hàng thật nếu đã có.
  const gopTB = ds.length
    ? ds.reduce((a,l)=>a+tinhLo(l).laiGop,0)/ds.length : 0;
  const hv = hoaVon(gopTB, cuLy);
  const thuc = ds.length;
  const laiThang = thuc*hv.bien - cd.tong;

  const bang = [1, 1.5, 2].map(ca=>{
    const gioNgay = ca*(dec(S.cfg.gioMoiCa)||8);
    const chThang = (dec(S.cfg.gioMotChuyen)||4.5)>0
      ? (gioNgay*(Number(S.cfg.soLaiXe)||1))/(dec(S.cfg.gioMotChuyen)||4.5)*(Number(S.cfg.ngayLamViec)||26) : 0;
    const lai = chThang*hv.bien - cd.tong;
    const dangChon = Math.abs(ca-nl.ca) < 0.01;
    return `<div class="row" style="${dangChon?'font-weight:700':''}">
      <span class="lbl" style="${dangChon?'color:var(--ink);font-weight:700':''}">${ca} ca · ${gioNgay} giờ/ngày · ${Math.round(chThang)} chuyến${dangChon?' ←':''}</span>
      <span class="val" style="color:${lai>=0?'var(--profit)':'var(--loss)'}">${vnd(lai)}</span></div>`;
  }).join('');

  return `
  <div class="eyebrow">Chi phí cố định mỗi tháng ${qm('codinh')}</div>
  <div class="card ${cd.tong===0?'alert mid':''}">
    <div class="row"><span class="lbl">Tiền thuê xe</span><span class="val">${vnd(cd.thueXe)}</span></div>

function loTinh(){
  const el=$('#lKq'); if(!el) return;
  const l = { muaTan:$('#lTan').value, muaDonGia:$('#lDgM').value, muaTienHang:'',
              banKhoi:$('#lKhoi').value, banDonGia:$('#lDgB').value, banTienHang:'',
              muaVat:'', banVat:'', cuLy:$('#lCuLy').value };
  const k = tinhLo(l);
  const chuan = Number(S.cfg.heSoQuyDoi)||1.5;
  const lech = k.heSo>0 ? Math.abs(k.heSo-chuan)/chuan*100 : 0;
  el.innerHTML = `
    <div class="card" style="margin-top:14px;background:var(--seal-soft);border-color:#B6C7DC">
      <div class="row"><span class="lbl">Tiền mua chưa VAT</span><span class="val">${vnd(k.muaHang)}</span></div>
      <div class="row"><span class="lbl">Tiền bán chưa VAT</span><span class="val">${vnd(k.banHang)}</span></div>
      <hr class="sep">
      <div class="row"><span class="lbl" style="font-weight:700;color:var(--ink)">Lãi gộp</span>
        <span class="val" style="color:${k.laiGop>=0?'var(--profit)':'var(--loss)'}">${vnd(k.laiGop)}</span></div>
      <div class="row"><span class="lbl">Chi phí chạy xe (${pct(k.cp.lit)} lít dầu)</span><span class="val">− ${vnd(k.cp.tong)}</span></div>
      <hr class="sep">
      <div class="row"><span class="lbl" style="font-weight:700;color:var(--ink)">Lãi ròng chuyến này</span>
        <span class="val" style="font-size:20px;color:${k.laiRong>=0?'var(--profit)':'var(--loss)'}">${vnd(k.laiRong)}</span></div>
      <hr class="sep">
      <div class="row"><span class="lbl">VAT thực nộp</span><span class="val">${vnd(k.vatNop)}</span></div>
      <div class="row"><span class="lbl">Hệ số quy đổi</span>
        <span class="val">${k.heSo>0?(Math.round(k.heSo*100)/100)+' tấn/m³':'—'}</span></div>
      ${lech>20?`<div class="chip warn">Lệch ${pct(lech)}% so với hệ số chuẩn ${chuan} — sổ kho sẽ không khớp</div>`:''}

    </div>`;

function vBanGiao(){
  const K=tinhThue(thangXem), D=dauThang(thangXem);
  const gui = S.sent.find(x=>x.thang===thangXem);
  const lech = K.ds.some(x=>lechChot(thangXem,x)!==0);
  const muc = [
    {ok:K.dtTong>0, t:'Đã ghi đủ ca chạy trong tháng'},
    {ok:K.dtChua===0&&K.dtTong>0, t:'Mọi công trình đã xuất hoá đơn'},
    {ok:!lech, t:'Không có chênh lệch doanh thu sau khi xuất hoá đơn'},
    {ok:K.ct.length>0, t:'Đã nhập hoá đơn đầu vào'},
    {ok:K.vatMat===0&&K.bkMat===0, t:'Không có khoản nào mất do trả tiền mặt'},
    {ok:tenLa().length===0, t:'Mọi công trình đã có hồ sơ khách'},
    {ok:D.dinhMuc>0, t:'Đã ban hành định mức nhiên liệu'},
    {ok:S.cfg.phuongAnXe!=='chua', t:'Xe đã có căn cứ pháp lý gắn với công ty'},
  ];
  const xong = muc.filter(m=>m.ok).length;
  return chonThang()+`
  <div class="card declar">
    ${xong===muc.length?'<span class="stamp">SẴN SÀNG GỬI</span>':`<span class="stamp warn">${xong}/${muc.length}</span>`}
    <div class="sub">Hồ sơ ${nhanThang(thangXem)}</div>
    <div class="big" style="font-size:20px">${xong===muc.length?'Đủ để bàn giao':'Còn thiếu '+(muc.length-xong)+' mục'}</div>
    <hr class="sep">
    ${muc.map(m=>`<div class="row"><span class="lbl">${m.t}</span>
      <span class="val" style="color:${m.ok?'var(--profit)':'var(--loss)'}">${m.ok?'✓':'✗'}</span></div>`).join('')}
  </div>
  <div class="eyebrow">Số liệu gửi kế toán</div>
  <div class="card">
    <div class="row"><span class="lbl">Doanh thu chưa VAT</span><span class="val">${vnd(K.dtTong)}</span></div>
    <div class="row"><span class="lbl">VAT đầu ra ${K.suat}%</span><span class="val">${vnd(K.vatRa)}</span></div>
    <div class="row"><span class="lbl">VAT đầu vào khấu trừ</span><span class="val">${vnd(K.vatVao)}</span></div>
    <div class="row"><span class="lbl">VAT phải nộp</span><span class="val">${vnd(K.vatNop)}</span></div>
    <div class="row"><span class="lbl">Chi phí có hoá đơn</span><span class="val">${vnd(K.chiHD)}</span></div>
    <div class="row"><span class="lbl">Chi phí theo bảng kê</span><span class="val">${vnd(K.chiBK)}</span></div>
    <div class="row"><span class="lbl">Km chạy / dầu đổ</span><span class="val">${vnd(D.km)} km / ${pct(D.lit)} l</span></div>
  </div>
  <button class="btn seal" onclick="xuat('ra')">Tải bảng kê hoá đơn ra</button>
  <button class="btn ghost" onclick="xuat('vao')">Tải bảng kê hoá đơn vào</button>
  <button class="btn ghost" onclick="xuat('lo')">Tải sổ lô hàng thương mại</button>
  <button class="btn ghost" onclick="xuat('bk')">Tải bảng kê 01/TNDN</button>
  <button class="btn ghost" onclick="xuat('hoso')">Tải hồ sơ pháp lý công ty & xe</button>
  <button class="btn ${gui?'ghost':''}" onclick="danhDauGui()">
    ${gui?`Đã gửi ngày ${dmy(gui.ngay)} — bấm để bỏ đánh dấu`:'Đánh dấu đã gửi kế toán'}</button>
  <div class="eyebrow">Hạn sắp tới</div>
  ${hanThue().slice(0,4).map(h=>{const c=soNgay(homNay(),h.ngay);
    return `<div class="card"><div class="row"><b style="font-size:14.5px">${h.ten}</b>
      <span class="chip ${c<0?'bad':c<=12?'warn':''}">${dmy(h.ngay)}</span></div>
      <div class="sub" style="margin-top:4px">${h.ghi}</div></div>`;}).join('')}
  <div class="note">Bốn file này cộng với ảnh hoá đơn gốc là trọn bộ việc của anh.

async function danhDauGui(){
  const i=S.sent.findIndex(x=>x.thang===thangXem);

function taiFile(ten,hang){
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const csv='\uFEFF'+hang.map(r=>r.map(q).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=ten; a.click(); URL.revokeObjectURL(a.href);
}
function xuat(loai){
  const K=tinhThue(thangXem), t=thangXem.replace('-','');
  if(loai==='ra'){
    const h=[['Tháng','Công trình','Khách hàng','MST khách','Loại giao dịch','Số chuyến','Doanh thu chưa VAT',
      'Thuế suất %','Tiền VAT','Tổng thanh toán','Đã xuất HĐ','Số hoá đơn','Ngày xuất','Chênh lệch so với số đã chốt']];
    K.ds.forEach(x=>{ const r=traRa(thangXem,x.key)||{}, kh=x.khachId?S.khach.find(k=>k.id===x.khachId):null;
      const ts=suatDong(thangXem,x), vat=x.doanhThu*ts/100;
      h.push([nhanThang(thangXem), x.ten, kh?kh.ten:'', kh?kh.mst:'', LOAI_GD[loaiDong(thangXem,x)].ten, x.chuyen,

        r.daXuat?'Có':'CHƯA', r.soHD||'', dmy(r.ngayXuat||''), lechChot(thangXem,x)||'']); });
    h.push([]); h.push(['TỔNG','','','','','',Math.round(K.dtTong),'',Math.round(K.vatRa),'','','','','']);
    taiFile(`hoadon-ra-${t}.csv`,h);
  } else if(loai==='vao'){
    const h=[['Ngày','Nhà cung cấp','MST','Khoản chi','Số hoá đơn','Tiền hàng','VAT','Tổng',

    ctThang(thangXem).sort((a,b)=>a.ngay<b.ngay?-1:1).forEach(x=>
      h.push([dmy(x.ngay),x.ncc||'',x.mst||'',LOAI[x.loai]||'Khác',x.soHD||'',x.tienHang||0,

    h.push([]); h.push(['TỔNG','','','','','',Math.round(K.vatVao),Math.round(K.chiHD),'','','']);
    taiFile(`hoadon-vao-${t}.csv`,h);
  } else if(loai==='lo'){
    const h=[['Ngày','Mặt hàng','Mua của','MST mỏ','Số tấn','Đơn giá/tấn','Tiền mua chưa VAT','VAT mua','Số HĐ mỏ',
      'Bán cho','MST khách','Số m³','Đơn giá/m³','Tiền bán chưa VAT','VAT bán','Số HĐ bán',
      'Hệ số tấn/m³','Lãi gộp','Cự ly km','Chi phí chuyến','Lãi ròng']];
    loThang(thangXem).sort((a,b)=>a.ngay<b.ngay?-1:1).forEach(l=>{
      const k=tinhLo(l), m=nccById(l.nccId), kh=S.khach.find(x=>x.id===l.khachId);

  const i=S.khach.findIndex(x=>x.id===o.id); if(i>=0)S.khach[i]=o; else S.khach.push(o);

function fHD(id){
  const h = S.hopDong.find(x=>x.id===id) || {id:null,khachId:'',so:'',ngayKy:homNay(),hetHan:'',giaTri:'',ghiChu:''};
  moModal(`<h2>${id?'Sửa hợp đồng':'Thêm hợp đồng vận chuyển'}</h2>
    <input type="hidden" id="hId" value="${h.id||''}">
    <label for="hKh">Khách hàng</label>
    <select id="hKh"><option value="">— chọn —</option>
      ${S.khach.map(k=>`<option value="${k.id}" ${h.khachId===k.id?'selected':''}>${esc(k.ten)}</option>`).join('')}</select>
    <label for="hSo">Số hợp đồng</label><input id="hSo" value="${esc(h.so)}">
    <div class="g2">
      <div><label for="hKy">Ngày ký</label><input type="date" id="hKy" value="${h.ngayKy}"></div>
      <div><label for="hHan">Hết hạn</label><input type="date" id="hHan" value="${h.hetHan}"></div></div>
    <label for="hGt">Giá trị hợp đồng (nếu có)</label><input id="hGt" inputmode="numeric" value="${h.giaTri}">
    <label for="hGhi">Ghi chú</label><input id="hGhi" value="${esc(h.ghiChu)}">
    <div class="note">App nhắc trước 30 ngày khi hợp đồng sắp hết hạn.
      Mẫu hợp đồng vận chuyển đã có trong bộ văn bản, chỉ cần điền và ký.</div>
    <button class="btn acc" onclick="luuHD()">Lưu hợp đồng</button>
    ${id?`<button class="del" onclick="xoa('hopDong','${id}')">Xoá hợp đồng này</button>`:''}
    <button class="btn ghost" onclick="dongModal()">Đóng</button>`); }
async function luuHD(){
  const o={id:$('#hId').value||uid(), khachId:$('#hKh').value, so:$('#hSo').value.trim(),
    ngayKy:$('#hKy').value, hetHan:$('#hHan').value, giaTri:num($('#hGt').value), ghiChu:$('#hGhi').value.trim()};
  const i=S.hopDong.findIndex(x=>x.id===o.id); if(i>=0)S.hopDong[i]=o; else S.hopDong.push(o);
  await luu(); dongModal(); ve(); toast('Đã lưu'); }

function fDinhMuc(){ const c=S.cfg, D=dauThang(thangXem);
  moModal(`<h2>Định mức tiêu hao nhiên liệu</h2>
    <div class="sub">Anh tự khai theo kinh nghiệm chạy thật. Con số này bảo vệ chi phí dầu của anh.</div>
    ${D.km>0?`<div class="card" style="margin-top:12px"><div class="row"><span class="lbl">Thực tế ${nhanThang(thangXem)}</span>
      <span class="val">${pct(D.thucTe)} lít/100km</span></div>
      <div class="sub" style="margin-top:5px">${vnd(D.km)} km · ${pct(D.lit)} lít. Lấy con số này làm mốc rồi cộng thêm biên độ an toàn.</div></div>`:''}
    <label for="dCo">Chạy có tải (lít/100km)</label><input id="dCo" inputmode="decimal" value="${c.dmCoTai}">
    <label for="dKh">Chạy không tải (lít/100km)</label><input id="dKh" inputmode="decimal" value="${c.dmKhongTai}">
    <label for="dCh">Nổ máy chờ hàng, nâng hạ ben (lít/giờ)</label><input id="dCh" inputmode="decimal" value="${c.dmChoHang}">
    <div class="note">Khai xong, in <b>Quyết định ban hành định mức tiêu hao nhiên liệu</b> trong bộ văn bản,
      điền đúng ba con số này, ký và đóng dấu, lưu vào hồ sơ công ty. Không có tờ đó thì con số ở đây
      không có giá trị với cơ quan thuế.</div>
    <button class="btn acc" onclick="luuDinhMuc()">Lưu định mức</button>
    <button class="btn ghost" onclick="dongModal()">Đóng</button>`); }
async function luuDinhMuc(){
  Object.assign(S.cfg,{dmCoTai:dec($('#dCo').value),dmKhongTai:dec($('#dKh').value),dmChoHang:dec($('#dCh').value)});
  await luu(); dongModal(); ve(); toast('Đã lưu định mức'); }

function fKhoan(){ const c=S.cfg;
  moModal(`<h2>Quy chế khoán chi</h2>
    <div class="sub">Các mức này biến tiền không hoá đơn thành chi phí được trừ.</div>
    <label for="qCh">Phụ cấp chuyến (đ/chuyến)</label><input id="qCh" inputmode="numeric" value="${c.khoanChuyen}">
    <label for="qCt">Công tác phí khoán (đ/ngày đi tỉnh)</label><input id="qCt" inputmode="numeric" value="${c.khoanCongTac}">
    <label for="qAn">Tiền ăn giữa ca (đ/ca)</label><input id="qAn" inputmode="numeric" value="${c.khoanAnCa}">
    <label for="qNh">Hỗ trợ nhà ở lái xe (đ/người/tháng)</label><input id="qNh" inputmode="numeric" value="${c.khoanNhaO}">
    <div class="note">Khai xong, in <b>Quyết định ban hành Quy chế chi tiêu nội bộ</b> trong bộ văn bản,
      điền đúng bốn con số này, ký đóng dấu. Đồng thời phải ghi lại các mức này trong
      <b>hợp đồng lao động</b> của từng lái xe — thiếu bước đó là khoản chi vẫn bị loại.</div>
    <button class="btn acc" onclick="luuKhoan()">Lưu mức khoán</button>
    <button class="btn ghost" onclick="dongModal()">Đóng</button>`); }
async function luuKhoan(){
  Object.assign(S.cfg,{khoanChuyen:num($('#qCh').value),khoanCongTac:num($('#qCt').value),
    khoanAnCa:num($('#qAn').value),khoanNhaO:num($('#qNh').value)});
  await luu(); dongModal(); ve(); toast('Đã lưu'); }

function fChinhSach(){
  moModal(`<h2>Thuế suất đầu ra</h2>
    <label for="pTs">Phần trăm VAT xuất trên hoá đơn</label>
    <input id="pTs" inputmode="numeric" value="${S.cfg.thueSuatRa}">
    <div class="note">Chỉ sửa khi chính sách giảm 2% hết hiệu lực hoặc kế toán yêu cầu.
      Sửa sai ở đây là sai toàn bộ số liệu bàn giao.</div>
    <button class="btn acc" onclick="luuChinhSach()">Lưu</button>
    <button class="btn ghost" onclick="dongModal()">Đóng</button>`); }
async function luuChinhSach(){
  S.cfg.thueSuatRa = Number($('#pTs').value)||VAT_RA; await luu(); dongModal(); ve(); }

function mPhuongAn(){
  const c=S.cfg, gia=Number(c.giaXeTong)||0, nam=Number(c.namKhauHao)||10;
  const kh=gia/nam, lptb=gia*LPTB/100;
  const thueNam=(Number(c.tienThueThang)||0)*12;
  const thueCN = thueNam>NGUONG_THUE_TS ? thueNam*0.10 : 0;
  moModal(`<h2>Bán xe cho công ty hay cho công ty thuê?</h2>
    <div class="sub">Tính trên giá xe ${vnd(gia)} đ và dư nợ ${vnd(c.vayNganHang)} đ.</div>
    <div class="eyebrow">Phương án A — bán xe cho công ty</div>
    <div class="card">
      <div class="row"><span class="lbl">Khấu hao được trừ mỗi năm</span><span class="val">${vnd(kh)}</span></div>
      <div class="row"><span class="lbl">Thuế TNDN tiết kiệm</span><span class="val" style="color:var(--profit)">${vnd(kh*TNDN/100)}</span></div>
      <div class="row"><span class="lbl">Lệ phí trước bạ một lần</span><span class="val" style="color:var(--loss)">${vnd(lptb)}</span></div>
      <div class="sub" style="margin-top:8px">Công ty ghi nợ phải trả anh ${vnd(gia)} đ rồi trả dần.
        Tiền trả nợ gốc về túi anh <b>không chịu thuế thu nhập cá nhân</b>.</div>
      <div class="sub" style="margin-top:6px;color:var(--loss)">Vướng: xe đang thế chấp ${vnd(c.vayNganHang)} đ.
        Sang tên phải được ngân hàng đồng ý giải chấp hoặc chuyển khoản vay sang pháp nhân.</div>
    </div>
    <div class="eyebrow">Phương án B — cho công ty thuê</div>
    <div class="card">
      <div class="row"><span class="lbl">Tiền thuê mỗi tháng</span><span class="val">${vnd(c.tienThueThang)}</span></div>
      <div class="row"><span class="lbl">Cả năm</span><span class="val">${vnd(thueNam)}</span></div>
      <div class="row"><span class="lbl">Thuế TNDN tiết kiệm</span><span class="val" style="color:var(--profit)">${vnd(thueNam*TNDN/100)}</span></div>
      <div class="row"><span class="lbl">Thuế cá nhân phải nộp</span>
        <span class="val" style="color:${thueCN>0?'var(--loss)':'var(--profit)'}">${thueCN>0?vnd(thueCN):'0'}</span></div>
      <div class="sub" style="margin-top:8px">${thueCN>0
        ? `Vượt ngưỡng ${vnd(NGUONG_THUE_TS)} đ/năm nên phải nộp 5% GTGT + 5% TNCN trên <b>toàn bộ</b> tiền thuê.`
        : `Dưới ngưỡng ${vnd(NGUONG_THUE_TS)} đ/năm nên anh không phải nộp thuế cho thuê tài sản.`}</div>
      <div class="sub" style="margin-top:6px;color:var(--profit)">Không cần động đến ngân hàng, không sang tên,
        không mất trước bạ. Hợp đồng thuê bằng văn bản với cá nhân là căn cứ hợp lệ để xin phù hiệu.</div>
    </div>
    <label for="paThue">Thử mức tiền thuê khác (đ/tháng)</label>
    <input id="paThue" inputmode="numeric" value="${c.tienThueThang}">
    <label for="paNam">Số năm khấu hao nếu bán cho công ty</label>
    <input id="paNam" inputmode="numeric" value="${nam}">
    <div class="note">Khung khấu hao ô tô tải là 6–10 năm. Chọn 10 cho nhẹ: khấu hao 6 năm sẽ là
      ${vnd(gia/6)} đ/năm, gần như chắc chắn đẩy công ty vào lỗ sổ sách nhiều năm liền.</div>
    <label>Chốt phương án</label>
    <div class="seg" id="paSeg">
      <button type="button" data-v="chua" aria-pressed="${c.phuongAnXe==='chua'}" onclick="segPick(this)">Chưa chốt</button>
      <button type="button" data-v="ban" aria-pressed="${c.phuongAnXe==='ban'}" onclick="segPick(this)">Bán</button>
      <button type="button" data-v="thue" aria-pressed="${c.phuongAnXe==='thue'}" onclick="segPick(this)">Cho thuê</button>
    </div>
    <button class="btn acc" onclick="luuPhuongAn()">Lưu và tính lại</button>
    <button class="btn ghost" onclick="dongModal()">Đóng</button>`); }
async function luuPhuongAn(){
  S.cfg.tienThueThang=num($('#paThue').value);
  S.cfg.namKhauHao=Number($('#paNam').value)||10;
  S.cfg.phuongAnXe=$('#paSeg button[aria-pressed="true"]').dataset.v;
  await luu(); dongModal(); ve(); mPhuongAn(); }

/* ══════════ MODAL + ĐĂNG NHẬP ══════════ */
function segPick(b){ b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b)); }
function moModal(html){
  $('#modalRoot').innerHTML=`<div class="backdrop" id="bd"><div class="sheet">
    <button class="x" onclick="dongModal()">×</button>${html}</div></div>`;
  $('#bd').addEventListener('click',e=>{ if(e.target.id==='bd') dongModal(); }); }
function dongModal(){ $('#modalRoot').innerHTML=''; }

/* Chạy nhúng trong Sổ Xe Ben: thue.html?embed=1 */
const EMBED = new URLSearchParams(location.search).get('embed')==='1';
if(EMBED){
  document.body.classList.add('embed');
  const n = document.querySelector('nav'), sh = $('#shell');
  sh.insertBefore(n, $('#view'));   // thanh tab lên đầu, nhường chỗ cho tab của app mẹ
}

auth.onAuthStateChanged(u=>{
  if(u){ $('#login').style.display='none'; $('#shell').style.display='flex'; tai(); }
  else { $('#login').style.display='flex'; $('#shell').style.display='none'; } });
$('#lBtn').addEventListener('click', async ()=>{
  $('#lErr').textContent='';
  try{ await auth.signInWithEmailAndPassword($('#lEmail').value.trim(), $('#lPass').value); }
  catch(e){ $('#lErr').textContent='Sai email hoặc mật khẩu.'; } });
$('#lPass').addEventListener('keydown', e=>{ if(e.key==='Enter') $('#lBtn').click(); });
</script>
</body>
</html>
